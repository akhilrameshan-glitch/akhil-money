<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><link rel="manifest" href="manifest.json"><title>Akhil Money</title><style>
:root{--navy:#102a43;--blue:#176b87;--teal:#2a9d8f;--bg:#f3f6fa;--card:#fff;--text:#172b4d;--muted:#65758b;--line:#e1e8f0;--red:#c0392b;--green:#16805d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}.top{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;padding:22px 18px 26px;border-radius:0 0 24px 24px}.top h1{margin:0;font-size:23px}.top p{margin:5px 0 0;color:#d8e7f1;font-size:13px}.wrap{max-width:920px;margin:auto}.content{padding:14px;max-width:920px;margin:auto}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#fff;border-top:1px solid var(--line);padding:7px 4px max(7px,env(safe-area-inset-bottom));box-shadow:0 -4px 18px #102a4310}.tabs button{flex:1;min-width:61px;border:0;background:transparent;color:var(--muted);font-size:11px;padding:6px 2px}.tabs button span{display:block;font-size:19px;margin-bottom:2px}.tabs button.active{color:var(--blue);font-weight:750}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 3px 12px #102a4306}.metric small,.muted{color:var(--muted)}.metric strong{display:block;font-size:20px;margin-top:5px;overflow-wrap:anywhere}.section-title{font-size:18px;margin:18px 0 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{font-size:12px;padding:4px 8px;border-radius:99px;background:#eaf4f8;color:var(--blue)}button,.btn{cursor:pointer}.primary,button.primary{border:0;background:var(--blue);color:white;border-radius:10px;padding:10px 13px;font-weight:650}.secondary{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:9px 12px}.danger{color:var(--red)}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #ccd7e2;border-radius:10px;padding:11px;background:white;color:var(--text);font:inherit}textarea{min-height:76px}form .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}.formgrid .full{grid-column:1/-1}.listitem{padding:12px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}.amount.income{color:var(--green)}.amount.expense{color:var(--red)}.smallbtn{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 8px;font-size:12px}.empty{color:var(--muted);text-align:center;padding:22px 8px}.hidden{display:none!important}.bar{height:8px;background:#e9eef4;border-radius:99px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--teal)}.note{font-size:12px;color:var(--muted);line-height:1.5}.tag{font-size:11px;border-radius:6px;padding:3px 6px;background:#f0f3f7}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#172b4d;color:white;padding:10px 14px;border-radius:10px;z-index:10;display:none;max-width:90vw}.filebtn{display:inline-block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:white}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.content{padding:20px}.top{padding-left:max(20px,calc((100vw - 880px)/2));padding-right:max(20px,calc((100vw - 880px)/2))}}@media(max-width:420px){.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.metric strong{font-size:17px}}
</style></head><body><header class="top"><div class="wrap"><h1>💰 Akhil Money</h1><p>Your personal finance dashboard · stored on this device</p></div></header><main class="content" id="app"></main><nav class="tabs" id="tabs"></nav><div class="toast" id="toast"></div><input id="restoreFile" type="file" accept="application/json,.json" class="hidden">
<script>
(()=>{'use strict';const $=s=>document.querySelector(s);const keys={accounts:'akhil_accounts',txs:'akhil_txs',budgets:'akhil_budgets',recurring:'akhil_recurring',bills:'akhil_bills',currency:'akhil_currency',owes:'akhil_owes',assets:'akhil_assets',categories:'akhil_categories'};const defaults={accounts:[{id:'cash',name:'Cash in hand',kind:'asset',currency:'AED',opening:0},{id:'bank',name:'Bank account',kind:'asset',currency:'AED',opening:0},{id:'card1',name:'Credit card 1',kind:'liability',currency:'AED',opening:0},{id:'card2',name:'Credit card 2',kind:'liability',currency:'AED',opening:0},{id:'card3',name:'Credit card 3',kind:'liability',currency:'AED',opening:0}],txs:[],budgets:[],recurring:[],bills:[],owes:[],assets:[],categories:{expense:['Food','Transport','Shopping','Bills','Health','Entertainment','Education','Travel','Home','Other'],income:['Salary','Business','Interest','Gift','Other']}};function load(k,f){try{const v=localStorage.getItem(keys[k]);return v===null?structuredClone(f):JSON.parse(v)}catch{return structuredClone(f)}}let state={accounts:load('accounts',defaults.accounts),txs:load('txs',[]),budgets:load('budgets',[]),recurring:load('recurring',[]),bills:load('bills',[]),owes:load('owes',[]),assets:load('assets',[]),categories:load('categories',defaults.categories),currency:load('currency','AED')};let page='Home';function save(){for(const k of Object.keys(keys))if(k in state)localStorage.setItem(keys[k],JSON.stringify(state[k]));}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n,c='AED'){try{return new Intl.NumberFormat('en',{style:'currency',currency:c,maximumFractionDigits:2}).format(Number(n)||0)}catch{return `${c} ${(Number(n)||0).toFixed(2)}`}}function fmtDate(d){if(!d)return '';return new Date(d+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}function today(){return new Date().toISOString().slice(0,10)}function acct(id){return state.accounts.find(a=>a.id===id)}function accountBalance(a){let b=Number(a.opening)||0;for(const t of state.txs){if(t.currency!==a.currency)continue;const n=Number(t.amount)||0;if(t.type==='income'&&t.account===a.id)b+=n;if(t.type==='expense'&&t.account===a.id)b-=n;if(t.type==='transfer'){if(t.from===a.id)b-=n;if(t.to===a.id)b+=n}if(t.type==='cardpayment'){if(t.from===a.id)b-=n;if(t.to===a.id)b+=n}}return b}function currencies(){return [...new Set(state.accounts.map(a=>a.currency).concat(state.txs.map(t=>t.currency),state.owes.map(o=>o.currency),state.assets.map(a=>a.currency)))].filter(Boolean).sort()}function totals(c){let assets=0,liabs=0;state.accounts.filter(a=>a.currency===c).forEach(a=>{const b=accountBalance(a);if(a.kind==='liability')liabs+=Math.abs(Math.min(0,b));else assets+=b});assets+=state.assets.filter(a=>a.currency===c).reduce((s,a)=>s+Number(a.value||a.cost||0),0);assets+=state.owes.filter(o=>o.currency===c).reduce((s,o)=>s+Math.max(0,Number(o.amount)-Number(o.paid||0)),0);return {assets,liabs,net:assets-liabs}}function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}const nav=[['Home','⌂'],['Record','＋'],['Activity','↕'],['Reports','▥'],['Plan','◷'],['Owes Me','↗'],['Assets','◆'],['Accounts','▤'],['Settings','⚙'],['AI','✦']];function render(){save();$('#tabs').innerHTML=nav.map(([n,ic])=>`<button class="${page===n?'active':''}" data-page="${n}"><span>${ic}</span>${n}</button>`).join('');$('#app').innerHTML=({Home:home,Record:record,Activity:activity,Reports:reports,Plan:plan,'Owes Me':owes,Assets:assets,Accounts:accounts,Settings:settings,AI:ai}[page]||home)();}function section(s){return `<h2 class="section-title">${s}</h2>`}function empty(s){return `<div class="empty">${s}</div>`}function acctOptions(currency,allowAll=false){return state.accounts.filter(a=>!currency||a.currency===currency).map(a=>`<option value="${esc(a.id)}">${esc(a.name)} · ${a.currency}</option>`).join('')}function currencyOptions(selected='AED'){return [...new Set(['AED','INR','USD','EUR','GBP','SAR','QAR','KWD','OMR','BHD','PKR','LKR','AUD','CAD','SGD','JPY','CNY',...state.accounts.map(a=>a.currency)])].map(c=>`<option ${c===selected?'selected':''}>${c}</option>`).join('')}function categoryOptions(type,selected){return (state.categories[type]||[]).map(c=>`<option ${c===selected?'selected':''}>${esc(c)}</option>`).join('')}
function home(){const cs=currencies();const txs=[...state.txs].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);return `${section('Your net worth')}<div class="grid">${cs.map(c=>{const t=totals(c);return `<div class="card metric"><small>${c} · Net worth</small><strong>${money(t.net,c)}</strong><small>Assets ${money(t.assets,c)} · Debts ${money(t.liabs,c)}</small></div>`}).join('')||`<div class="card">Add an account to start tracking your money.</div>`}</div><div class="grid"><div class="card metric"><small>Accounts</small><strong>${state.accounts.length}</strong></div><div class="card metric"><small>Transactions</small><strong>${state.txs.length}</strong></div><div class="card metric"><small>People owe you</small><strong>${state.owes.filter(o=>o.amount>o.paid).length}</strong></div><div class="card metric"><small>Tracked assets</small><strong>${state.assets.length}</strong></div></div>${section('Recent activity')}<div class="card">${txs.length?txs.map(txRow).join(''):empty('No transactions yet. Tap Record to add your first transaction.')}</div><div class="row"><button class="primary" data-page="Record">＋ Record transaction</button><button class="secondary" data-page="Accounts">Manage accounts</button></div>`}function txRow(t){const label=t.type==='transfer'?'Transfer':t.type==='cardpayment'?'Card payment':t.type==='income'?'Income':'Expense';const sign=t.type==='income'?'+':t.type==='expense'?'−':'';return `<div class="listitem row"><div style="min-width:0"><b>${esc(t.note||t.category||label)}</b><div class="muted" style="font-size:12px">${fmtDate(t.date)} · ${esc(t.category||label)} · ${esc((acct(t.account)||acct(t.from)||{}).name||'')}</div></div><div class="amount ${t.type==='income'?'income':t.type==='expense'?'expense':''}">${sign}${money(t.amount,t.currency)}</div></div>`}function record(){return `${section('Record a transaction')}<div class="card"><form id="txForm"><div class="formgrid"><div><label>Type</label><select name="type" id="txType"><option value="expense">Expense</option><option value="income">Income</option><option value="transfer">Transfer</option><option value="cardpayment">Credit card payment</option></select></div><div><label>Currency</label><select name="currency" id="txCurrency">${currencyOptions(state.currency)}</select></div><div id="accountField"><label>Account</label><select name="account">${acctOptions()}</select></div><div id="categoryField"><label>Category</label><select name="category" id="txCategory">${categoryOptions('expense')}</select></div><div id="fromField" class="hidden"><label>From account</label><select name="from">${acctOptions()}</select></div><div id="toField" class="hidden"><label>To account / card</label><select name="to">${acctOptions()}</select></div><div><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></div><div><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="full"><label>Note (optional)</label><input name="note" placeholder="What was this for?"></div></div><div class="actions"><button class="primary">Save transaction</button><button class="secondary" type="reset">Clear</button></div></form></div><p class="note">Amounts are recorded in the selected currency. Transfers and card payments should use accounts with the same currency.</p>`}function activity(){return `${section('Activity')}<div class="card"><div class="formgrid"><div><label>Search</label><input id="searchTx" placeholder="Search notes or category"></div><div><label>Type</label><select id="filterType"><option value="">All types</option><option value="income">Income</option><option value="expense">Expense</option><option value="transfer">Transfer</option><option value="cardpayment">Card payment</option></select></div><div><label>Currency</label><select id="filterCurrency"><option value="">All currencies</option>${currencies().map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Month</label><input id="filterMonth" type="month" value="${today().slice(0,7)}"></div></div><div id="txList">${txList(state.txs)}</div><button class="secondary" id="exportCsv">Export CSV</button></div>`}function txList(list){return list.length?[...list].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(t=>`${txRow(t)}<div style="text-align:right;margin-top:-5px"><button class="smallbtn danger" data-delete-tx="${t.id}">Delete</button></div>`).join(''):empty('No matching transactions.')}function reports(){const month=today().slice(0,7),ts=state.txs.filter(t=>(t.date||'').startsWith(month));const cs=currencies();return `${section('Monthly reports')}<div class="card"><label>Month</label><input id="reportMonth" type="month" value="${month}"><div id="reportBody">${reportBody(ts,cs)}</div></div>`}function reportBody(ts,cs){return cs.map(c=>{const arr=ts.filter(t=>t.currency===c),inc=arr.filter(t=>t.type==='income').reduce((s,t)=>s+ +t.amount,0),exp=arr.filter(t=>t.type==='expense').reduce((s,t)=>s+ +t.amount,0);const cats={};arr.filter(t=>t.type==='expense').forEach(t=>cats[t.category||'Other']=(cats[t.category||'Other']||0)+ +t.amount);return `<div class="card"><b>${c}</b><div class="grid"><div><small class="muted">Income</small><div class="amount income">${money(inc,c)}</div></div><div><small class="muted">Expenses</small><div class="amount expense">${money(exp,c)}</div></div></div><p><b>Net flow: ${money(inc-exp,c)}</b></p>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="row"><span>${esc(n)}</span><span>${money(v,c)}</span></div>`).join('')||'<p class="muted">No expenses this month.</p>'}</div>`}).join('')||empty('Add an account or transaction to see reports.')}function plan(){return `${section('Budgets, recurring items & bills')}<div class="card"><h3>Monthly budgets</h3><form id="budgetForm"><div class="formgrid"><div><label>Category</label><select name="category">${categoryOptions('expense')}</select></div><div><label>Currency</label><select name="currency">${currencyOptions()}</select></div><div><label>Monthly limit</label><input name="amount" type="number" min="0.01" step=".01" required></div><div class="full"><button class="primary">Add budget</button></div></div></form>${state.budgets.map(b=>{const used=state.txs.filter(t=>t.type==='expense'&&t.currency===b.currency&&t.category===b.category&&(t.date||'').startsWith(today().slice(0,7))).reduce((s,t)=>s+ +t.amount,0);return `<div class="listitem"><div class="row"><b>${esc(b.category)} · ${b.currency}</b><span>${money(used,b.currency)} / ${money(b.amount,b.currency)}</span></div><div class="bar"><i style="width:${Math.min(100,used/(b.amount||1)*100)}%"></i></div><div style="text-align:right;margin-top:6px"><button class="smallbtn danger" data-del-budget="${b.id}">Delete</button></div></div>`}).join('')||empty('No budgets yet.')}</div><div class="card"><h3>Recurring transaction templates</h3><form id="recForm"><div class="formgrid"><div><label>Name</label><input name="name" required placeholder="Rent, salary…"></div><div><label>Type</label><select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></div><div><label>Amount</label><input name="amount" type="number" min="0.01" step=".01" required></div><div><label>Currency</label><select name="currency">${currencyOptions()}</select></div><div><label>Frequency</label><select name="frequency"><option>Weekly</option><option>Monthly</option><option>Yearly</option></select></div><div><label>Next date</label><input name="date" type="date" value="${today()}"></div></div><div class="actions"><button class="primary">Add template</button></div></form>${state.recurring.map(r=>`<div class="listitem row"><div><b>${esc(r.name)}</b><div class="muted">${esc(r.frequency)} · ${fmtDate(r.date)} · ${money(r.amount,r.currency)}</div></div><button class="smallbtn" data-post-rec="${r.id}">Record now</button><button class="smallbtn danger" data-del-rec="${r.id}">×</button></div>`).join('')||empty('No recurring templates.')}</div><div class="card"><h3>Bill reminders</h3><form id="billForm"><div class="formgrid"><div><label>Bill name</label><input name="name" required></div><div><label>Amount</label><input name="amount" type="number" min="0" step=".01"></div><div><label>Currency</label><select name="currency">${currencyOptions()}</select></div><div><label>Due date</label><input name="date" type="date" value="${today()}"></div></div><div class="actions"><button class="primary">Add reminder</button></div></form>${state.bills.map(b=>`<div class="listitem row"><div><b>${esc(b.name)}</b><div class="muted">Due ${fmtDate(b.date)} · ${money(b.amount,b.currency)}</div></div><button class="smallbtn" data-paid-bill="${b.id}">Mark paid</button><button class="smallbtn danger" data-del-bill="${b.id}">×</button></div>`).join('')||empty('No bill reminders.')}</div>`}function owes(){return `${section('Owes Me')}<div class="card"><p class="note">Track money people owe you. Repayments reduce the outstanding balance. Each record uses its own currency.</p><form id="oweForm"><div class="formgrid"><div><label>Person</label><input name="person" required placeholder="Name"></div><div><label>Currency</label><select name="currency">${currencyOptions()}</select></div><div><label>Amount owed</label><input name="amount" type="number" min="0.01" step=".01" required></div><div><label>Date</label><input name="date" type="date" value="${today()}"></div><div class="full"><label>Reason / note</label><input name="note" placeholder="Optional"></div></div><div class="actions"><button class="primary">Add person / debt</button></div></form></div>${state.owes.map(o=>{const due=Math.max(0,+o.amount-(+o.paid||0));return `<div class="card"><div class="row"><div><b>${esc(o.person)}</b><div class="muted">${esc(o.note||'Money owed')} · ${fmtDate(o.date)}</div></div><span class="pill">${o.currency}</span></div><div class="grid"><div><small class="muted">Original</small><strong>${money(o.amount,o.currency)}</strong></div><div><small class="muted">Outstanding</small><strong>${money(due,o.currency)}</strong></div></div><div class="muted">Repaid: ${money(o.paid||0,o.currency)}</div><form data-repay="${o.id}" class="formgrid"><div><label>Record repayment</label><input name="repayment" type="number" min=".01" max="${due}" step=".01" required placeholder="Amount"></div><div style="align-self:end"><button class="primary">Add repayment</button> <button class="smallbtn danger" type="button" data-del-owe="${o.id}">Delete</button></div></form></div>`}).join('')||empty('No one owes you yet. Add your first record above.')}`}function assets(){return `${section('Assets & purchases')}<div class="card"><p class="note">Record items such as a house, vehicle, gold, or electronics separately from everyday expenses. Asset values are included in net worth by currency.</p><form id="assetForm"><div class="formgrid"><div><label>Asset name</label><input name="name" required placeholder="Car, house, gold…"></div><div><label>Type</label><select name="type"><option>Property</option><option>Vehicle</option><option>Gold / jewellery</option><option>Investment</option><option>Electronics</option><option>Other</option></select></div><div><label>Acquisition cost</label><input name="cost" type="number" min="0" step=".01" required></div><div><label>Current estimated value</label><input name="value" type="number" min="0" step=".01" placeholder="Leave blank to use cost"></div><div><label>Currency</label><select name="currency">${currencyOptions()}</select></div><div><label>Purchase date</label><input name="date" type="date" value="${today()}"></div><div class="full"><label>Notes</label><input name="note" placeholder="Optional"></div></div><div class="actions"><button class="primary">Add asset</button></div></form></div>${state.assets.map(a=>`<div class="card"><div class="row"><b>${esc(a.name)}</b><span class="pill">${esc(a.type)}</span></div><div class="grid"><div><small class="muted">Cost</small><strong>${money(a.cost,a.currency)}</strong></div><div><small class="muted">Current value</small><strong>${money(a.value??a.cost,a.currency)}</strong></div></div><div class="muted">Bought ${fmtDate(a.date)} ${a.note?'· '+esc(a.note):''}</div><div style="text-align:right;margin-top:8px"><button class="smallbtn danger" data-del-asset="${a.id}">Delete asset</button></div></div>`).join('')||empty('No assets recorded yet.')}`}function accounts(){return `${section('Accounts')}<div class="card"><form id="accountForm"><h3>Add account</h3><div class="formgrid"><div><label>Account name</label><input name="name" required placeholder="e.g. SBI savings"></div><div><label>Type</label><select name="kind"><option value="asset">Cash / bank / asset account</option><option value="liability">Credit card / liability</option></select></div><div><label>Currency</label><select name="currency">${currencyOptions()}</select></div><div><label>Opening balance</label><input name="opening" type="number" step=".01" value="0"></div></div><div class="actions"><button class="primary">Add account</button></div></form></div>${state.accounts.map(a=>`<div class="card"><div class="row"><div><b>${esc(a.name)}</b><div class="muted">${a.kind==='liability'?'Credit card / liability':'Cash or bank'} · ${a.currency}</div></div><strong>${money(accountBalance(a),a.currency)}</strong></div><div class="actions"><button class="smallbtn" data-edit-account="${a.id}">Edit name / opening</button>${!['cash','bank','card1','card2','card3'].includes(a.id)?`<button class="smallbtn danger" data-del-account="${a.id}">Delete</button>`:''}</div></div>`).join('')}<div class="card"><h3>Net worth by currency</h3>${currencies().map(c=>{const t=totals(c);return `<div class="listitem row"><b>${c}</b><span>${money(t.net,c)}</span></div>`}).join('')}</div>`}function settings(){return `${section('Settings & data')}<div class="card"><label>Default currency for new entries</label><select id="defaultCurrency">${currencyOptions(state.currency)}</select><p class="note">Currency totals remain separate. Changing the default does not convert existing amounts.</p></div><div class="card"><h3>Custom categories</h3><form id="catForm"><div class="formgrid"><div><label>Category type</label><select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></div><div><label>New category name</label><input name="name" required></div></div><div class="actions"><button class="primary">Add category</button></div></form>${['expense','income'].map(type=>`<h4>${type==='expense'?'Expense':'Income'} categories</h4>${(state.categories[type]||[]).map(c=>`<div class="listitem row"><span>${esc(c)}</span><button class="smallbtn" data-rename-cat="${type}|${esc(c)}">Rename</button><button class="smallbtn danger" data-del-cat="${type}|${esc(c)}">Delete</button></div>`).join('')}`).join('')}</div><div class="card"><h3>Backup and restore</h3><p class="note">Create a JSON backup of your accounts, transactions, budgets, recurring templates, bills, Owes Me records, assets, and categories. Keep a copy somewhere safe.</p><div class="actions"><button class="primary" id="backup">Download backup</button><label class="filebtn">Restore backup<input id="restoreInline" type="file" accept="application/json,.json" style="display:none"></label></div><p class="note">Data is stored locally in this browser on this device. Clearing browser website data can erase it. Backup regularly.</p></div><div class="card"><h3>Install / refresh</h3><p class="note">If you installed this as an app, close and reopen it after updating the website. If old screens remain, refresh the page.</p></div>`}function ai(){return `${section('Money helper')}<div class="card"><p class="note">This assistant works locally using simple rules; it does not send your financial data to a server.</p><form id="aiForm"><label>Ask about your records</label><textarea name="q" required placeholder="e.g. How much did I spend this month? Which bills are due?"></textarea><div class="actions"><button class="primary">Ask</button></div></form><div id="aiAnswer"></div></div>`}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});$('#app').addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}const del=e.target.closest('[data-delete-tx]');if(del){if(confirm('Delete this transaction?')){state.txs=state.txs.filter(t=>t.id!==del.dataset.deleteTx);render()}return}const actions=[['data-del-budget','budgets'],['data-del-rec','recurring'],['data-del-bill','bills'],['data-del-owe','owes'],['data-del-asset','assets'],['data-del-account','accounts']];for(const [attr,k] of actions){const el=e.target.closest('['+attr+']');if(el){if(confirm('Delete this item?')){state[k]=state[k].filter(x=>x.id!==el.getAttribute(attr));render()}return}}const paid=e.target.closest('[data-paid-bill]');if(paid){state.bills=state.bills.filter(x=>x.id!==paid.dataset.paidBill);toast('Bill marked paid');render();return}const post=e.target.closest('[data-post-rec]');if(post){const r=state.recurring.find(x=>x.id===post.dataset.postRec);if(r){state.txs.push({id:id(),type:r.type,amount:+r.amount,currency:r.currency,date:today(),category:r.category||'Other',account:state.accounts.find(a=>a.currency===r.currency&&a.kind==='asset')?.id||state.accounts[0]?.id,note:r.name});toast('Transaction recorded')}render();return}const ed=e.target.closest('[data-edit-account]');if(ed){const a=acct(ed.dataset.editAccount);const name=prompt('Account name',a.name);if(name!==null&&name.trim()){a.name=name.trim();const op=prompt('Opening balance in '+a.currency,a.opening);if(op!==null&&Number.isFinite(+op))a.opening=+op;render()}return}const catR=e.target.closest('[data-rename-cat]');if(catR){const [type,...rest]=catR.dataset.renameCat.split('|'),old=rest.join('|'),n=prompt('Rename category',old);if(n&&n.trim()){state.categories[type]=state.categories[type].map(c=>c===old?n.trim():c);state.txs.forEach(t=>{if(t.category===old)t.category=n.trim()});render()}return}const catD=e.target.closest('[data-del-cat]');if(catD){const [type,...rest]=catD.dataset.delCat.split('|'),name=rest.join('|');if(confirm('Delete category? Existing transactions keep their category text.')){state.categories[type]=state.categories[type].filter(c=>c!==name);render()}return}if(e.target.id==='exportCsv'){const rows=[['date','type','amount','currency','category','note','account'],...state.txs.map(t=>[t.date,t.type,t.amount,t.currency,t.category,t.note,(acct(t.account)||{}).name||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('akhil-money-transactions.csv',csv,'text/csv');return}if(e.target.id==='backup'){download('akhil-money-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');return}});
$('#app').addEventListener('change',e=>{if(e.target.id==='defaultCurrency'){state.currency=e.target.value;save();toast('Default currency updated')}if(e.target.id==='txType'){const type=e.target.value;$('#categoryField').classList.toggle('hidden',!['income','expense'].includes(type));$('#accountField').classList.toggle('hidden',['transfer','cardpayment'].includes(type));$('#fromField').classList.toggle('hidden',!['transfer','cardpayment'].includes(type));$('#toField').classList.toggle('hidden',!['transfer','cardpayment'].includes(type));const cat=$('#txCategory');if(cat&&['income','expense'].includes(type))cat.innerHTML=categoryOptions(type)}if(e.target.id==='txCurrency'){const c=e.target.value;const form=$('#txForm');['account','from','to'].forEach(n=>{const el=form.elements[n];if(el)el.innerHTML=acctOptions(c)});}if(e.target.id==='reportMonth'){const m=e.target.value;$('#reportBody').innerHTML=reportBody(state.txs.filter(t=>(t.date||'').startsWith(m)),currencies())}if(['searchTx','filterType','filterCurrency','filterMonth'].includes(e.target.id))filterTx()});$('#app').addEventListener('input',e=>{if(e.target.id==='searchTx')filterTx()});function filterTx(){const q=($('#searchTx')?.value||'').toLowerCase(),type=$('#filterType')?.value||'',cur=$('#filterCurrency')?.value||'',month=$('#filterMonth')?.value||'';const arr=state.txs.filter(t=>(!q||(`${t.note||''} ${t.category||''}`).toLowerCase().includes(q))&&(!type||t.type===type)&&(!cur||t.currency===cur)&&(!month||(t.date||'').startsWith(month)));const list=$('#txList');if(list)list.innerHTML=txList(arr)}
$('#app').addEventListener('submit',e=>{const f=e.target;if(!f.id&&!f.matches('[data-repay]'))return;e.preventDefault();const d=Object.fromEntries(new FormData(f).entries());if(f.id==='txForm'){const type=d.type,amount=+d.amount,currency=d.currency;if(!amount||amount<=0)return toast('Enter an amount above zero');if(['transfer','cardpayment'].includes(type)){if(d.from===d.to)return toast('Choose two different accounts');if(acct(d.from)?.currency!==currency||acct(d.to)?.currency!==currency)return toast('Both accounts must use the selected currency')}state.txs.push({id:id(),type,amount,currency,date:d.date,category:d.category|| (type==='transfer'?'Transfer':type==='cardpayment'?'Card payment':''),account:d.account,from:d.from,to:d.to,note:d.note||''});toast('Transaction saved');page='Activity';render()}else if(f.id==='accountForm'){state.accounts.push({id:id(),name:d.name.trim(),kind:d.kind,currency:d.currency,opening:+d.opening||0});toast('Account added');render()}else if(f.id==='budgetForm'){state.budgets.push({id:id(),category:d.category,currency:d.currency,amount:+d.amount});render()}else if(f.id==='recForm'){state.recurring.push({id:id(),...d,amount:+d.amount});render()}else if(f.id==='billForm'){state.bills.push({id:id(),...d,amount:+d.amount||0});render()}else if(f.id==='oweForm'){state.owes.push({id:id(),...d,amount:+d.amount,paid:0});render()}else if(f.id==='assetForm'){state.assets.push({id:id(),...d,cost:+d.cost,value:d.value===''?undefined:+d.value});render()}else if(f.id==='catForm'){if(state.categories[d.type].some(c=>c.toLowerCase()===d.name.trim().toLowerCase()))return toast('Category already exists');state.categories[d.type].push(d.name.trim());render()}else if(f.matches('[data-repay]')){const o=state.owes.find(x=>x.id===f.dataset.repay),n=+d.repayment;if(!o||n<=0||n>o.amount-o.paid)return toast('Enter a valid repayment amount');o.paid+=n;toast('Repayment saved');render()}else if(f.id==='aiForm'){const q=d.q.toLowerCase(),month=today().slice(0,7);let answer='I can help summarize your local records. Try asking about spending, income, budgets, bills, assets, or who owes you.';if(q.includes('spend')||q.includes('expense'))answer=currencies().map(c=>`${c}: this month expenses ${money(state.txs.filter(t=>t.type==='expense'&&t.currency===c&&(t.date||'').startsWith(month)).reduce((s,t)=>s+ +t.amount,0),c)}`).join('<br>')||'No transactions yet.';else if(q.includes('income')||q.includes('earn'))answer=currencies().map(c=>`${c}: this month income ${money(state.txs.filter(t=>t.type==='income'&&t.currency===c&&(t.date||'').startsWith(month)).reduce((s,t)=>s+ +t.amount,0),c)}`).join('<br>');else if(q.includes('owe'))answer=state.owes.map(o=>`${esc(o.person)} owes ${money(o.amount-o.paid,o.currency)}`).join('<br>')||'No Owes Me records.';else if(q.includes('bill'))answer=state.bills.map(b=>`${esc(b.name)} due ${fmtDate(b.date)}: ${money(b.amount,b.currency)}`).join('<br>')||'No bill reminders.';else if(q.includes('asset'))answer=state.assets.map(a=>`${esc(a.name)}: ${money(a.value??a.cost,a.currency)}`).join('<br>')||'No assets recorded.';$('#aiAnswer').innerHTML=`<div class="card">${answer}</div>`;return} });function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('#restoreFile').addEventListener('change',restore);$('#app').addEventListener('change',e=>{if(e.target.id==='restoreInline'){const f=e.target.files[0];if(f)readRestore(f)}});function restore(e){const f=e.target.files?.[0];if(f)readRestore(f)}function readRestore(f){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.accounts||!x.txs)throw Error('Invalid backup');if(!confirm('Restore backup and replace the current app data on this device?'))return;state={...state,...x};save();render();toast('Backup restored')}catch{toast('Could not read this backup file')}};r.readAsText(f)}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
})();
